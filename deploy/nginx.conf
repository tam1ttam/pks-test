server {
  listen 80;
  server_name _;
  client_max_body_size 6m;

  location = /enrol/pks-test { return 301 /enrol/pks-test/; }

  location ^~ /enrol/pks-test/api/ {
    proxy_pass http://backend:3030/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location ^~ /enrol/pks-test/admin/ {
    try_files $uri $uri/ /enrol/pks-test/admin/index.html;
  }

  location ^~ /enrol/pks-test/ {
    try_files $uri $uri/ /enrol/pks-test/index.html;
  }

  location / { return 404; }
}
