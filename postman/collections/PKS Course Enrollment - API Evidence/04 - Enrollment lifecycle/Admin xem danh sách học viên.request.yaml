$kind: http-request
url: "{{baseUrl}}/admin/courses/{{courseCode}}/enrollments"
method: GET
headers:
  X-PKS-Portal: admin
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.expect(pm.response.json().total).to.eql(1);
    language: text/javascript
order: 5000
