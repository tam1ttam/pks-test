$kind: http-request
url: "{{baseUrl}}/enrollments"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "courseCode": "{{courseCode}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('HTTP 409', () => pm.response.to.have.status(409));
    language: text/javascript
order: 2000
