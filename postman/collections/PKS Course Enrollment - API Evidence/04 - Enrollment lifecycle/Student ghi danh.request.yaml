$kind: http-request
url: "{{baseUrl}}/enrollments"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "courseCode": "{{courseCode}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      const json = pm.response.json(); pm.collectionVariables.set('enrollmentCode', json.code); pm.expect(json.status).to.eql('ENROLLED');
    language: text/javascript
order: 1000
