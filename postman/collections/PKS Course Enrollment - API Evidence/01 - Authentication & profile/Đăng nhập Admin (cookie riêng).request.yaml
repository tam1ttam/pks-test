$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
  X-PKS-Portal: admin
body:
  type: json
  content: |-
    {
      "email": "{{adminEmail}}",
      "password": "{{adminPassword}}",
      "portal": "ADMIN"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.expect(pm.response.json().user.role).to.eql('ADMIN');
      pm.expect(pm.response.headers.get('Set-Cookie')).to.include('pks_admin_session');
    language: text/javascript
order: 7000
