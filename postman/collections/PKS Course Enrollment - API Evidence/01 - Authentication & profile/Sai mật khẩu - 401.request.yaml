$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{studentEmail}}",
      "password": "WrongPassword@123",
      "portal": "CLIENT"
    }
scripts:
  - type: afterResponse
    code: pm.test('HTTP 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 3000
