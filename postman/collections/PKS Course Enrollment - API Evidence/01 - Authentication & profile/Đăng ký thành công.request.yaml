$kind: http-request
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Postman Student",
      "email": "{{studentEmail}}",
      "password": "{{testPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      const json = pm.response.json(); pm.expect(json).not.to.have.property('id'); pm.collectionVariables.set('studentCode', json.code);
    language: text/javascript
order: 1000
