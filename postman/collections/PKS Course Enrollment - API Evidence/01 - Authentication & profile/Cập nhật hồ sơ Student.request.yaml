$kind: http-request
url: "{{baseUrl}}/users/me"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Postman Student Updated"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.expect(pm.response.json().fullName).to.eql('Postman Student Updated');
    language: text/javascript
order: 6000
