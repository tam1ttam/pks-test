$kind: http-request
url: "{{baseUrl}}/auth/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.expect(pm.response.json().code).to.eql(pm.collectionVariables.get('studentCode'));
      pm.expect(pm.response.json()).not.to.have.property('id');
    language: text/javascript
order: 5000
