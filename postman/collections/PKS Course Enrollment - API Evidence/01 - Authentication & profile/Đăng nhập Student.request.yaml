$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{studentEmail}}",
      "password": "{{testPassword}}",
      "portal": "CLIENT"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.expect(pm.response.headers.get('Set-Cookie')).to.include('pks_client_session');
    language: text/javascript
order: 4000
