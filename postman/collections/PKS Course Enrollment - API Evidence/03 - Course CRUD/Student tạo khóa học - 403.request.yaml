$kind: http-request
url: "{{baseUrl}}/admin/courses"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Student denied",
      "categoryCode": "{{categoryCode}}",
      "instructor": "PKS",
      "shortDescription": "denied",
      "description": "denied",
      "tuition": 0,
      "capacity": 1
    }
scripts:
  - type: afterResponse
    code: pm.test('HTTP 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 5000
