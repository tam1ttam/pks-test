$kind: http-request
url: "{{baseUrl}}/categories"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      const json = pm.response.json(); pm.expect(json.items).to.be.an('array').and.not.empty;
      pm.collectionVariables.set('categoryCode', json.items[0].code);
    language: text/javascript
order: 2000
