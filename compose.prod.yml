services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: deploy/.env.production
    volumes:
      - pks_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    env_file: deploy/.env.production
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3030"

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_API_URL: /enrol/pks-test/api
        CLIENT_BASE_PATH: /enrol/pks-test/
        ADMIN_BASE_PATH: /enrol/pks-test/admin/
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:13030:80"

volumes:
  pks_postgres_data:
